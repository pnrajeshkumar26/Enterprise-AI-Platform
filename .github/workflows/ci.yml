name: Enterprise AI Platform CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # TEST RUNTIME API
  # ============================================================
  test:
    name: Test Runtime API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/runtime-api

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # GitHub / OIDC diagnostic information
      # --------------------------------------------------------
      - name: Show GitHub OIDC identity
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/runtime-api/requirements.txt

      # --------------------------------------------------------
      # Runtime API dependencies + test tooling
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # --------------------------------------------------------
      # Run all repository tests
      #
      # PYTHONPATH=. means:
      # services/runtime-api/
      # becomes the Python import root and exposes app/
      # --------------------------------------------------------
      - name: Run tests
        run: |
          PYTHONPATH=. python -m pytest -q ../../tests


  # ============================================================
  # BUILD + PUSH RUNTIME API IMAGE
  # ============================================================
  docker:
    name: Build Runtime API Image
    runs-on: ubuntu-latest
    needs: test

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::436529477721:role/EnterpriseAIPlatformGitHubActionsRole
          aws-region: ap-south-1

      # --------------------------------------------------------
      # ECR login
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Build and push Runtime API image
      # --------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/runtime-api
          file: services/runtime-api/Dockerfile
          push: true
          tags: 436529477721.dkr.ecr.ap-south-1.amazonaws.com/enterprise-ai-platform/runtime-api:latest
