name: Enterprise AI Platform CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test Runtime API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/runtime-api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/runtime-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: PYTHONPATH=. pytest -q ../../tests

  docker:
    name: Build Runtime API Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::436529477721:role/EnterpriseAIPlatformGitHubActionsRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/runtime-api
          file: services/runtime-api/Dockerfile
          push: true
          tags: 436529477721.dkr.ecr.ap-south-1.amazonaws.com/enterprise-ai-platform/runtime-api:latest
