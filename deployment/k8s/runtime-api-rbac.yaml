apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-api
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-api-model-lifecycle
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
    resourceNames:
      - vllm
      - tinyllama
    verbs:
      - get
      - patch
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-api-model-lifecycle
  namespace: default
subjects:
  - kind: ServiceAccount
    name: runtime-api
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-api-model-lifecycle
