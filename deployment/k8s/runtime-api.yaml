apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-api
  template:
    metadata:
      labels:
        app: runtime-api
    spec:
      containers:
        - name: runtime-api
          image: enterprise-runtime-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: VLLM_URL
              value: "http://172.18.0.1:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-api
spec:
  selector:
    app: runtime-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
