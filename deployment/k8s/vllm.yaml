apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: vllm

  template:
    metadata:
      labels:
        app: vllm

    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia

      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"

          command:
            - vllm
            - serve

          args:
            - /models/Phi-3-mini-4k-instruct
            - --served-model-name
            - microsoft/Phi-3-mini-4k-instruct
            - --dtype
            - half
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.80"
            - --host
            - "0.0.0.0"
            - --port
            - "8000"

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          volumeMounts:
            - name: model-storage
              mountPath: /models
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12

      volumes:
        - name: model-storage
          hostPath:
            path: /models
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: default
spec:
  selector:
    app: vllm

  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

  type: ClusterIP
