apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    basicAuth: false
    isDefault: false
    editable: false
    version: 5

    jsonData:
      httpMethod: GET

      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"

        tags:
          - key: service.name
            value: service

        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
