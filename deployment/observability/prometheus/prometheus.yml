global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ==========================================================
  # Enterprise AI Runtime API
  # ==========================================================
  - job_name: "runtime-api"
    scrape_interval: 15s
    metrics_path: /metrics/
    static_configs:
      - targets:
          - "enterprise-runtime-api:8000"

  # ==========================================================
  # Prometheus self-monitoring
  # ==========================================================
  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "prometheus:9090"

  # ==========================================================
  # NVIDIA DCGM GPU telemetry
  # ==========================================================
  - job_name: "dcgm"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "enterprise-dcgm-exporter:9400"
