services:
  runtime-api:
    build:
      context: ../../services/runtime-api
      dockerfile: Dockerfile

    image: enterprise-runtime-api:3.19
    container_name: enterprise-runtime-api
    restart: unless-stopped

    ports:
      - "8001:8000"

    environment:
      MODEL_ROOT: /models
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OTEL_SERVICE_NAME: enterprise-runtime-api
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://enterprise-alloy:4318"
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: "1.0"

    networks:
      - enterprise-ai-net

networks:
  enterprise-ai-net:
    external: true
